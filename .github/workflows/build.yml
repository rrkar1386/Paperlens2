name: Build SmartPDFReader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Create Android project
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/smartpdfreader
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmartPDFReader"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.3.0' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.smartpdfreader'
              compileSdk 37

              defaultConfig {
                  applicationId 'com.smartpdfreader'
                  minSdk 23
                  targetSdk 37
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Smart PDF Reader"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".ReaderActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Smart PDF Reader"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp"/>

              <Button
                  android:id="@+id/openPdfButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Open PDF"/>

          </LinearLayout>
          EOF

          cat > project/app/src/main/res/layout/activity_reader.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">

              <TextView
                  android:id="@+id/pageInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:padding="8dp"/>

              <ScrollView
                  android:id="@+id/scrollView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:fillViewport="true">

                  <LinearLayout
                      android:id="@+id/pageContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"/>

              </ScrollView>

          </LinearLayout>
          EOF

          cat > project/app/src/main/java/com/smartpdfreader/MainActivity.java <<'EOF'
          package com.smartpdfreader;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Button;

          public class MainActivity extends Activity {

              private static final int PICK_PDF = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button open = findViewById(R.id.openPdfButton);

                  open.setOnClickListener(v -> {
                      Intent intent =
                              new Intent(Intent.ACTION_OPEN_DOCUMENT);

                      intent.setType("application/pdf");
                      intent.addCategory(Intent.CATEGORY_OPENABLE);

                      startActivityForResult(intent, PICK_PDF);
                  });
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if (requestCode == PICK_PDF &&
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null) {

                      Uri uri = data.getData();

                      Intent intent =
                              new Intent(
                                      this,
                                      ReaderActivity.class);

                      intent.setData(uri);
                      startActivity(intent);
                  }
              }
          }
          EOF

          cat > project/app/src/main/java/com/smartpdfreader/ReaderActivity.java <<'EOF'
          package com.smartpdfreader;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.ParcelFileDescriptor;
          import android.view.ViewGroup;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.IOException;

          public class ReaderActivity extends Activity {

              private PdfRenderer renderer;
              private ParcelFileDescriptor descriptor;

              private LinearLayout container;
              private TextView pageInfo;
              private ScrollView scrollView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(
                          R.layout.activity_reader);

                  container =
                          findViewById(
                                  R.id.pageContainer);

                  pageInfo =
                          findViewById(
                                  R.id.pageInfo);

                  scrollView =
                          findViewById(
                                  R.id.scrollView);

                  Uri uri =
                          getIntent().getData();

                  if (uri != null) {
                      openPdf(uri);
                  }
              }

              private void openPdf(Uri uri) {

                  try {
                      descriptor =
                              getContentResolver()
                                      .openFileDescriptor(
                                              uri,
                                              "r");

                      if (descriptor == null) {
                          throw new IOException(
                                  "Cannot open PDF");
                      }

                      renderer =
                              new PdfRenderer(
                                      descriptor);

                      int count =
                              renderer.getPageCount();

                      pageInfo.setText(
                              "Reading • " +
                              count +
                              " pages");

                      for (int i = 0;
                           i < count;
                           i++) {

                          renderPage(i);
                      }

                  } catch (Exception e) {

                      pageInfo.setText(
                              "Unable to open PDF");
                  }
              }

              private void renderPage(int index) {

                  PdfRenderer.Page page =
                          renderer.openPage(index);

                  int width =
                          getResources()
                                  .getDisplayMetrics()
                                  .widthPixels - 24;

                  float scale =
                          (float) width /
                          page.getWidth();

                  int height =
                          (int) (
                                  page.getHeight()
                                  * scale
                          );

                  Bitmap bitmap =
                          Bitmap.createBitmap(
                                  width,
                                  height,
                                  Bitmap.Config.ARGB_8888);

                  bitmap.eraseColor(
                          Color.WHITE);

                  page.render(
                          bitmap,
                          null,
                          null,
                          PdfRenderer.Page
                                  .RENDER_MODE_FOR_DISPLAY);

                  page.close();

                  ImageView image =
                          new ImageView(this);

                  image.setImageBitmap(bitmap);

                  image.setAdjustViewBounds(
                          true);

                  image.setScaleType(
                          ImageView.ScaleType
                                  .FIT_CENTER);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                  params.setMargins(
                          8,
                          8,
                          8,
                          8);

                  container.addView(
                          image,
                          params);

                  TextView number =
                          new TextView(this);

                  number.setText(
                          "Page " +
                          (index + 1));

                  number.setGravity(17);

                  container.addView(
                          number);
              }

              @Override
              protected void onDestroy() {

                  if (renderer != null) {
                      renderer.close();
                  }

                  if (descriptor != null) {

                      try {
                          descriptor.close();
                      } catch (IOException ignored) {
                      }
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFReader-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
