name: Build SmartPDFReader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q SmartPDFReader_V1_Android_Project.zip -d project

      - name: Fix Android project
        working-directory: project
        run: |
          python3 - <<'PY'
          import os
          import re

          # Find all Gradle build files
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file == "build.gradle":
                      path = os.path.join(root, file)

                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()

                      # Ensure PdfBox-Android uses the valid Maven Central version
                      text = re.sub(
                          r"com\.tom-roush:pdfbox-android:[0-9.]+",
                          "com.tom-roush:pdfbox-android:2.0.27.0",
                          text
                      )

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

                      print("Checked:", path)

          # Fix the ReaderActivity page-number parsing
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file == "ReaderActivity.java":
                      path = os.path.join(root, file)

                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()

                      text = text.replace(
                          'Integer.parseInt(url.substring("app://page/"))',
                          'Integer.parseInt(url.substring("app://page/".length()))'
                      )

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

                      print("Checked:", path)
          PY

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFReader-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
