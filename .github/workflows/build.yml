name: Build SmartPDFReader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q SmartPDFReader_V1_Android_Project.zip -d project

      - name: Fix PDFBox dependency
        working-directory: project
        run: |
          find . -name "build.gradle" -type f -exec sed -i 's/com.tom-roush:pdfbox-android:[^"]*/com.tom-roush:pdfbox-android:2.0.27.0/g' {} \;

      - name: Fix ReaderActivity page parsing
        working-directory: project
        run: |
          sed -i 's|int page = Integer.parseInt(url.substring("app://page/"));|int page = Integer.parseInt(url.substring("app://page/".length()));|' app/src/main/java/com/smartpdf/reader/ReaderActivity.java

      - name: Configure Maven mirror
        working-directory: project
        run: |
          find . -name "settings.gradle" -o -name "settings.gradle.kts" | while read f; do
            sed -i '/repositories {/a\        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }' "$f"
          done

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFReader-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
