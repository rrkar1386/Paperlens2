name: Build SmartPDFReader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Create Android project
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/smartpdfreader
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmartPDFReader"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.3.0' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.smartpdfreader'
              compileSdk 37

              defaultConfig {
                  applicationId 'com.smartpdfreader'
                  minSdk 21
                  targetSdk 37
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Smart PDF Reader"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".ReaderActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Smart PDF Reader"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="12dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Open a PDF to begin reading"
                  android:textSize="17sp"
                  android:layout_marginBottom="32dp"/>

              <Button
                  android:id="@+id/openPdfButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Open PDF"/>
          </LinearLayout>
          EOF

          cat > project/app/src/main/res/layout/activity_reader.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="8dp">

                  <Button
                      android:id="@+id/backButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Back"/>

                  <Button
                      android:id="@+id/originalButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Original PDF"/>

                  <Button
                      android:id="@+id/pageButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Go to page"/>
              </LinearLayout>

              <TextView
                  android:id="@+id/pageInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:padding="6dp"
                  android:textSize="14sp"/>

              <ScrollView
                  android:id="@+id/scrollView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:fillViewport="true">

                  <LinearLayout
                      android:id="@+id/pageContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"/>
              </ScrollView>
          </LinearLayout>
          EOF

          cat > project/app/src/main/java/com/smartpdfreader/MainActivity.java <<'EOF'
          package com.smartpdfreader;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Button;

          public class MainActivity extends Activity {

              private static final int PICK_PDF = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button open = findViewById(R.id.openPdfButton);
                  open.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.setType("application/pdf");
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      startActivityForResult(intent, PICK_PDF);
                  });
              }

              @Override
              protected void onActivityResult(int requestCode,
                                              int resultCode,
                                              Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_PDF &&
                      resultCode == RESULT_OK &&
                      data != null &&
                      data.getData() != null) {

                      Uri uri = data.getData();

                      try {
                          getContentResolver().takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );
                      } catch (Exception ignored) {
                      }

                      Intent intent = new Intent(this, ReaderActivity.class);
                      intent.setData(uri);
                      startActivity(intent);
                  }
              }
          }
          EOF

          cat > project/app/src/main/java/com/smartpdfreader/ReaderActivity.java <<'EOF'
          package com.smartpdfreader;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.ParcelFileDescriptor;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.IOException;

          public class ReaderActivity extends Activity {

              private PdfRenderer renderer;
              private ParcelFileDescriptor fileDescriptor;
              private Uri pdfUri;

              private LinearLayout pageContainer;
              private ScrollView scrollView;
              private TextView pageInfo;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_reader);

                  pageContainer = findViewById(R.id.pageContainer);
                  scrollView = findViewById(R.id.scrollView);
                  pageInfo = findViewById(R.id.pageInfo);

                  Button backButton = findViewById(R.id.backButton);
                  Button originalButton = findViewById(R.id.originalButton);
                  Button pageButton = findViewById(R.id.pageButton);

                  backButton.setOnClickListener(v -> finish());

                  pdfUri = getIntent().getData();

                  if (pdfUri == null) {
                      Toast.makeText(
                              this,
                              "No PDF selected",
                              Toast.LENGTH_LONG
                      ).show();
                      finish();
                      return;
                  }

                  openPdf();

                  originalButton.setOnClickListener(
                          v -> openOriginalPdf()
                  );

                  pageButton.setOnClickListener(
                          v -> showPageDialog()
                  );
              }

              private void openPdf() {
                  try {
                      fileDescriptor =
                              getContentResolver().openFileDescriptor(
                                      pdfUri,
                                      "r"
                              );

                      if (fileDescriptor == null) {
                          throw new IOException("Unable to open PDF");
                      }

                      renderer = new PdfRenderer(fileDescriptor);
                      renderAllPages();

                  } catch (Exception e) {
                      Toast.makeText(
                              this,
                              "Unable to open PDF: " + e.getMessage(),
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void renderAllPages() {
                  pageContainer.removeAllViews();

                  int pageCount = renderer.getPageCount();

                  pageInfo.setText(
                          "Reading • " + pageCount + " pages"
                  );

                  for (int i = 0; i < pageCount; i++) {
                      renderPage(i);
                  }
              }

              private void renderPage(int index) {
                  PdfRenderer.Page page = null;

                  try {
                      page = renderer.openPage(index);

                      float density = getResources()
                              .getDisplayMetrics()
                              .density;

                      int screenWidth = getResources()
                              .getDisplayMetrics()
                              .widthPixels;

                      int availableWidth =
                              screenWidth - (int)(16 * density);

                      float scale =
                              (float) availableWidth /
                              (float) page.getWidth();

                      int bitmapWidth = Math.max(
                              1,
                              (int)(page.getWidth() * scale)
                      );

                      int bitmapHeight = Math.max(
                              1,
                              (int)(page.getHeight() * scale)
                      );

                      Bitmap bitmap = Bitmap.createBitmap(
                              bitmapWidth,
                              bitmapHeight,
                              Bitmap.Config.ARGB_8888
                      );

                      bitmap.eraseColor(Color.WHITE);

                      page.render(
                              bitmap,
                              null,
                              null,
                              PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY
                      );

                      ImageView imageView = new ImageView(this);

                      imageView.setImageBitmap(bitmap);
                      imageView.setAdjustViewBounds(true);
                      imageView.setScaleType(
                              ImageView.ScaleType.FIT_CENTER
                      );
                      imageView.setBackgroundColor(Color.WHITE);

                      LinearLayout.LayoutParams params =
                              new LinearLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT
                              );

                      params.setMargins(
                              (int)(8 * density),
                              (int)(8 * density),
                              (int)(8 * density),
                              (int)(8 * density)
                      );

                      pageContainer.addView(
                              imageView,
                              params
                      );

                      TextView pageNumber =
                              new TextView(this);

                      pageNumber.setText(
                              "Page " + (index + 1)
                      );

                      pageNumber.setGravity(
                              Gravity.CENTER
                      );

                      pageNumber.setPadding(
                              0,
                              0,
                              0,
                              (int)(8 * density)
                      );

                      pageContainer.addView(
                              pageNumber,
                              new LinearLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT
                              )
                      );

                  } finally {
                      if (page != null) {
                          page.close();
                      }
                  }
              }

              private void openOriginalPdf() {
                  try {
                      Intent intent =
                              new Intent(Intent.ACTION_VIEW);

                      intent.setDataAndType(
                              pdfUri,
                              "application/pdf"
                      );

                      intent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                      );

                      startActivity(intent);

                  } catch (Exception e) {
                      Toast.makeText(
                              this,
                              "No PDF viewer available",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              private void showPageDialog() {
                  if (renderer == null) {
                      return;
                  }

                  final EditText input =
                          new EditText(this);

                  input.setInputType(
                          android.text.InputType.TYPE_CLASS_NUMBER
                  );

                  input.setHint("Page number");

                  new AlertDialog.Builder(this)
                          .setTitle("Go to page")
                          .setView(input)
                          .setNegativeButton(
                                  "Cancel",
                                  null
                          )
                          .setPositiveButton(
                                  "Go",
                                  (dialog, which) -> {
                                      try {
                                          int page =
                                                  Integer.parseInt(
                                                          input.getText()
                                                                  .toString()
                                                  );

                                          if (page < 1 ||
                                              page > renderer.getPageCount()) {
                                              throw new NumberFormatException();
                                          }

                                          int targetIndex =
                                                  page - 1;

                                          ViewGroup child =
                                                  (ViewGroup)
                                                          pageContainer
                                                                  .getChildAt(
                                                                          targetIndex * 2
                                                                  );

                                          if (child != null) {
                                              child.post(
                                           
